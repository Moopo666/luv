<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>มีอะไรจะบอก... ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Mali', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;s
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 2.2rem 1.8rem;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.45);
            text-align: center;
            width: 88%;
            max-width: 380px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .emoji-header {
            font-size: 4.5rem;
            margin-bottom: 0.8rem;
            animation: bounce 1.5s infinite;
            display: inline-block;
        }

        h1 {
            color: #d6336c;
            font-size: 1.55rem;
            margin-bottom: 0.6rem;
            line-height: 1.4;
        }

        p {
            color: #666;
            font-size: 1.05rem;
            margin-bottom: 1.8rem;
            min-height: 1.6em;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 60px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 12px 26px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        #yesBtn {
            background: #ff477e;
            color: white;
            z-index: 12;
        }

        #yesBtn:active {
            transform: scale(0.95);
        }

        #noBtn {
            background: #f1f3f5;
            color: #495057;
            z-index: 11;
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        /* หน้าจอหลังกดตกลง */
        .success-screen {
            display: none;
        }

        .heart-particle {
            position: fixed;
            bottom: -10vh;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 5;
            animation: floatUp linear forwards;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-115vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- หน้าจอคำถาม -->
    <div class="card" id="askCard">
        <div class="emoji-header" id="emoji">🥺👉👈</div>
        <h1 id="questionText">จีบ Again ได้มุ้ย?</h1>
        <p id="subText">สัญญาว่าจะพาอ้วงกว่าเดิม ❤️</p>
        
        <div class="btn-group">
            <button id="yesBtn">ตกลง 💖</button>
            <button id="noBtn">ไม่ตกลง 😝</button>
        </div>
    </div>

    <!-- หน้าจอเมื่อกดตกลง -->
    <div class="card success-screen" id="successCard">
        <div class="emoji-header">🥰🎉💖</div>
        <h1>เย้! เป็นแฟนกันแล้วนะ</h1>
        <p>ขอบคุณที่ให้โอกาสนะครับ<br>รักที่สุดเลย ❤️✨</p>
        <button id="moreHeartsBtn" style="background: #ff477e; color: white; font-size: 1rem;">
            กดสาดหัวใจอีก 💕
        </button>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const askCard = document.getElementById('askCard');
        const successCard = document.getElementById('successCard');
        const subText = document.getElementById('subText');
        const emoji = document.getElementById('emoji');
        const moreHeartsBtn = document.getElementById('moreHeartsBtn');

        let dodgeCount = 0;
        let yesScale = 1;

        const pleadMessages = [
            "แน่ใจหรอ? คิดดูอีกทีน้า 🥺",
            "ปุ่มนั้นเสีย กดปุ่มชมพูดีกว่า! 💕",
            "ไม่ยอมให้กดหรอก แบร่! 😜",
            "ใจร้ายจัง กดตกลงเถอะนะ 🙏",
            "เลี้ยงชาไข่มุกทุกวันเลยเอ้า! 🧋",
            "หนีเก่งนะเรา กดตกลงได้แล้ว ❤️",
            "ปุ่มตกลงใหญ่ขนาดนี้แล้ว กดเลย! 💖"
        ];

        const emojis = ["🥺👉👈", "😢", "😭", "🥹", "🙏💖", "😚", "🥰"];

        function moveNoButton(e) {
            if (e) e.preventDefault();

            // ย้ายปุ่มออกจาก card มาอยู่กับ body เพื่อให้วิ่งได้ทั่วหน้าจอ
            if (noBtn.parentElement !== document.body) {
                document.body.appendChild(noBtn);
                noBtn.style.position = 'fixed';
            }

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const margin = 20;

            const maxX = window.innerWidth - btnWidth - margin;
            const maxY = window.innerHeight - btnHeight - margin;

            const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
            const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // เปลี่ยนข้อความอ้อนและขยายปุ่มตกลง
            subText.textContent = pleadMessages[dodgeCount % pleadMessages.length];
            emoji.textContent = emojis[dodgeCount % emojis.length];
            dodgeCount++;

            if (yesScale < 2.2) {
                yesScale += 0.15;
                yesBtn.style.transform = `scale(${yesScale})`;
            }
        }

        // รองรับทั้งการแตะบนมือถือ (touchstart) และเมาส์บนคอม (mouseover, click)
        noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // ฟังก์ชันสร้างหัวใจลอย
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            const icons = ['❤️', '💖', '💕', '💗', '💓', '🥰', '✨'];
            heart.textContent = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 95 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
            heart.style.fontSize = (Math.random() * 1.2 + 1.2) + 'rem';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4500);
        }

        function burstHearts(count = 25) {
            for (let i = 0; i < count; i++) {
                setTimeout(createHeart, i * 80);
            }
        }

        // เมื่อกดตกลง
        yesBtn.addEventListener('click', () => {
            askCard.style.display = 'none';
            noBtn.style.display = 'none';
            successCard.style.display = 'block';

            burstHearts(35);
            setInterval(createHeart, 350);
        });

        moreHeartsBtn.addEventListener('click', () => burstHearts(20));
    </script>
</body>
</html>
